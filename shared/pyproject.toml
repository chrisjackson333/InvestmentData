[tool.poetry]
name = "investment-platform-shared"
version = "0.1.0"
description = "Shared cross-domain contracts and utilities for the Investment Data Platform"
authors = ["Chris Jackson <chrisjackson333@gmail.com>"]
packages = [
    { include = "contracts" },
    { include = "utils" },
]

[tool.poetry.dependencies]
python = "^3.8"
pydantic = "^2.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
ruff = "^0.5"
pyright = "^1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-service integration tests",
    "contract: tests that verify cross-domain data contracts",
    "slow: tests that take significant time to run",
]
